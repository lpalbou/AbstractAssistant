[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abstractassistant"
version = "0.12.3"
description = "A sleek (macOS) system tray application providing instant access to LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Laurent-Philippe Albou", email = "contact@abstractcore.ai"}
]
keywords = ["ai", "llm", "macos", "system-tray", "assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Desktop Environment",
]

dependencies = [
    # Voice is a core part of the assistant, so local audio I/O ships by
    # default: abstractvoice[audio-io] pulls sounddevice + webrtcvad + soundfile
    # for in-process streaming TTS playback and microphone capture. (STT itself
    # runs on the gateway, so faster-whisper is NOT a base dependency — it comes
    # with the [voice] extra for anyone who also wants local transcription.)
    # abstractruntime supplies the session-memory run-id contract shared with
    # the gateway (session_attachments); execution itself stays on the gateway.
    "abstractruntime>=0.8.4",
    "abstractvoice[audio-io]>=0.11.2",
    # Used for an optional local config read (STT language hint) and the shared
    # About/identity helpers (abstractcore.utils.identity, new in 2.16.0); all
    # provider execution happens on the gateway, so no provider extras.
    "abstractcore>=2.16.0",
    # The native menu-bar bridge (status-item metrics, traffic lights) imports
    # AppKit; without it macOS reports the tray as never ready.
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    # Tray + Qt UI (kept import-safe; CLI help must not import GUI at import time).
    "Pillow>=10.0.0",
    "PyQt5>=5.15.0",
    # Global hotkey support for the tray shell; HIServices (ApplicationServices)
    # answers whether macOS lets this process read the keyboard.
    "pynput>=1.7.7",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    # Markdown rendering in UI
    "markdown-it-py>=4.0.0",
    "pygments>=2.16.0",
    # webrtcvad (pulled in by the [voice]/[apple]/[gpu] extras) depends on
    # pkg_resources at import time; pkg_resources remains available through
    # setuptools 80.x and disappears in 81+. The pin lives in base deps because
    # extras merge with base at resolve time.
    "setuptools>=61.0,<81",
]

[project.optional-dependencies]
lite = []  # Back-compat alias for the base install.
voice = [
    "abstractvoice[audio-io,stt]>=0.11.2",
]
apple = [
    "abstractcore[all-apple]>=2.16.0",
    "abstractvoice[all-apple]>=0.11.2",
]
gpu = [
    "abstractcore[all-gpu]>=2.16.0",
    "abstractvoice[all-gpu]>=0.11.2",
]
all = [
    "abstractvoice[audio-io,stt]>=0.11.2",
]  # Back-compat alias for full voice I/O.
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pyinstaller>=6.21.0",
]
macos-app = [
    "pyinstaller>=6.21.0",
]

[project.scripts]
assistant = "abstractassistant.cli:main"
abstractassistant = "abstractassistant.cli:main"
build-macos-app = "abstractassistant.build_macos_app:main"

[project.urls]
Homepage = "https://github.com/lpalbou/abstractassistant"
Repository = "https://github.com/lpalbou/abstractassistant"
Issues = "https://github.com/lpalbou/abstractassistant/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["abstractassistant*"]
exclude = ["tests*", "docs*", "AbstractAssistant.app*"]

[tool.setuptools.package-data]
abstractassistant = ["assets/*.png", "assets/automation_controls.json"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests/basic"]
markers = [
    "basic: Level A (contract/unit) tests",
    "integration: Level B (integration/local) tests",
    "e2e: Level C (end-to-end/real infra) tests (opt-in)",
]

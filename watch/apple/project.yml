name: AbstractAssistantWatch
options:
  bundleIdPrefix: ai.abstractframework.assistant
  deploymentTarget:
    watchOS: "26.0"
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AbstractGatewayClient:
    path: Packages/AbstractGatewayClient
targets:
  AbstractAssistantWatch:
    type: application
    platform: watchOS
    scheme: {}
    sources: [Sources/App, Resources]
    dependencies:
      - package: AbstractGatewayClient
    info:
      path: Resources/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # plain http to the gateway on the LAN (192.168.x.x, .local); internet stays https
        WKApplication: true
        WKWatchOnly: true
        CFBundleDisplayName: Assistant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Export compliance: only the system's HTTPS (exempt); no answer is asked on each upload.
        ITSAppUsesNonExemptEncryption: false
        # Keeps the app running with the screen off while the assistant listens, works or speaks
        # (WKExtendedRuntimeSession; Sources/App/Shared/RuntimeKeeper.swift).
        WKBackgroundModes: [self-care]
        NSMicrophoneUsageDescription: "Ask speaks with your assistant: what you say is sent to your gateway to be transcribed."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.abstractframework.assistant.watch
        # Info.plist is generated by XcodeGen from `info:` above (WKWatchOnly only: toolchain-check.md pitfall 1).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Device installs: automatic signing with the developer's team. CLI/CI simulator builds pass
        # CODE_SIGNING_ALLOWED=NO and ignore this; `xcodegen generate` keeps it (set it here, not in Xcode).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K3R4D6HP2A
        # Archived only inside the AbstractAssistant container (App Store / TestFlight); a second
        # top-level app in the archive makes it a "generic archive" with no distribution method.
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  # UI checks that need a real tap (e.g. a text field opens with its current text). Own scheme:
  # the app's scheme, CI and the release archive do not build it.
  AbstractAssistantWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [UITests]
    dependencies:
      - target: AbstractAssistantWatch
    scheme:
      testTargets: [AbstractAssistantWatchUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.abstractframework.assistant.watch.uitests
        TEST_TARGET_NAME: AbstractAssistantWatch
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K3R4D6HP2A

  # App Store / TestFlight carrier: a watch-only app ships inside an empty iOS container
  # (Xcode's watch-only template; product type watchapp2-container). It has no code and no UI;
  # the store installs only the watch app. Device builds keep using the AbstractAssistantWatch scheme.
  AbstractAssistant:
    type: application.watchapp2-container
    platform: iOS
    scheme: {}
    sources: []
    dependencies:
      - target: AbstractAssistantWatch
    info:
      path: Container/Info.plist
      properties:
        CFBundleDisplayName: AbstractAssistant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.abstractframework.assistant
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K3R4D6HP2A
        TARGETED_DEVICE_FAMILY: "1"

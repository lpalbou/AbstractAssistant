name: Watch app

# Builds and tests watch/apple on every change; the App Store Connect release runs only after
# a maintainer approves it. Maintainer notes live outside the repository.

on:
  push:
    branches: [main]
    paths:
      - "watch/apple/**"
  pull_request:
    paths:
      - "watch/apple/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The newest released (not beta) Xcode of this major version (the xcode-27 runner image).
  XCODE_MAJOR: "27"
  PROJECT_DIR: watch/apple
  SCHEME: AbstractAssistantWatch
  TEAM_ID: K3R4D6HP2A

jobs:
  build:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_MAJOR }}
        run: |
          # A released Xcode only: App Store Connect refuses builds made with a beta.
          app=$(ls -d /Applications/Xcode_${XCODE_MAJOR}.*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$app" ]; then
            echo "::error::No released Xcode ${XCODE_MAJOR}.x on this runner image. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate --spec project.yml

      - name: Package tests (AbstractGatewayClient)
        working-directory: ${{ env.PROJECT_DIR }}/Packages/AbstractGatewayClient
        run: swift test

      - name: Simulator build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild -project AbstractAssistantWatch.xcodeproj -scheme "$SCHEME" \
            -destination "generic/platform=watchOS Simulator" -configuration Debug \
            -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO -quiet

      - name: Device build (Release, unsigned)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild -project AbstractAssistantWatch.xcodeproj -scheme "$SCHEME" \
            -destination "generic/platform=watchOS" -configuration Release \
            -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO -quiet

      - name: The app is watch-only (a missing WKWatchOnly builds fine and fails at install)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          plist=build/DerivedData/Build/Products/Release-watchos/AbstractAssistantWatch.app/Info.plist
          test "$(plutil -extract WKWatchOnly raw "$plist")" = "true"
          test "$(plutil -extract WKApplication raw "$plist")" = "true"
          echo "version $(plutil -extract CFBundleShortVersionString raw "$plist")"

  release:
    name: Release to App Store Connect
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    environment:
      name: app-store
      url: https://appstoreconnect.apple.com/apps
    concurrency:
      group: watch-app-store-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: The App Store Connect key is configured
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::The app-store environment lacks:$missing"
            exit 1
          fi

      - name: Select Xcode ${{ env.XCODE_MAJOR }}
        run: |
          # A released Xcode only: App Store Connect refuses builds made with a beta.
          app=$(ls -d /Applications/Xcode_${XCODE_MAJOR}.*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$app" ]; then
            echo "::error::No released Xcode ${XCODE_MAJOR}.x on this runner image. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen and generate the project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Version and build number
        id: version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          version=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([0-9][0-9.]*)"?.*/\1/p' project.yml | head -1)
          if [ -z "$version" ]; then
            echo "::error::No MARKETING_VERSION in project.yml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          build=$(( ${{ github.run_number }} + 100 ))
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Watch $version (build $build)"

      - name: Write the API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Apple accepts the API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Signing reports a refused key only as "Communication with Apple failed (401)" and
          # "No profiles": ask the App Store Connect API directly and say which part is wrong.
          key="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          if ! head -1 "$key" | grep -q -- "-----BEGIN PRIVATE KEY-----"; then
            echo "::error::ASC_KEY_P8 must be the whole .p8 text, from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----"
            exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/jwt" && "$RUNNER_TEMP/jwt/bin/pip" install -q "pyjwt[crypto]==2.10.1"
          "$RUNNER_TEMP/jwt/bin/python" - "$key" <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          import jwt
          kid, iss = os.environ["ASC_KEY_ID"].strip(), os.environ["ASC_ISSUER_ID"].strip()
          now = int(time.time())
          token = jwt.encode({"iss": iss, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             open(sys.argv[1]).read(), algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/bundleIds?limit=200",
                                       headers={"Authorization": "Bearer " + token})
          try:
              ids = [b["attributes"]["identifier"] for b in json.load(urllib.request.urlopen(req, timeout=60))["data"]]
          except urllib.error.HTTPError as e:
              if e.code == 401:
                  print("::error::Apple refused the key (401): ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 do not "
                        "belong together, or the key was revoked. The Issuer ID is shown above the Team Keys "
                        "list in App Store Connect → Users and Access → Integrations.")
              elif e.code == 403:
                  print("::error::The key has no access to certificates and profiles (403): it needs the Admin role.")
              else:
                  print(f"::error::App Store Connect answered {e.code}: {e.read()[:300]!r}")
              sys.exit(1)
          print(f"Key accepted; {len(ids)} bundle ids on the team.")
          for bid in ("ai.abstractframework.assistant", "ai.abstractframework.assistant.watch"):
              print(f"  {bid}: {'registered' if bid in ids else 'not registered yet (signing registers it)'}")
          PY

      - name: Archive (signed at upload)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # Unsigned: a fresh runner has no development certificate, which automatic signing wants
          # at archive time ("No profiles … App Development"). The upload step signs both apps
          # with Apple's cloud-managed distribution certificate; checked locally 2026-10-17: same
          # identity and entitlements as an archive signed on a Mac. An archive made without
          # signing carries no .entitlements file, so a target that declares one must sign here.
          if grep -qi "entitlements" project.yml; then
            echo "::error::project.yml now declares entitlements: an unsigned archive would drop them. Sign the archive (development certificate as a secret) before uploading."
            exit 1
          fi
          # The Info.plists read $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION) (project.yml).
          xcodebuild archive -project AbstractAssistantWatch.xcodeproj -scheme AbstractAssistant \
            -destination "generic/platform=iOS" -configuration Release \
            -archivePath "$RUNNER_TEMP/AbstractAssistant.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO

      - name: The archive carries this version and build number
        run: |
          plist="$RUNNER_TEMP/AbstractAssistant.xcarchive/Products/Applications/AbstractAssistant.app/Watch/AbstractAssistantWatch.app/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "${{ steps.version.outputs.version }}"
          test "$(plutil -extract CFBundleVersion raw "$plist")" = "${{ steps.version.outputs.build }}"
          test "$(plutil -extract WKWatchOnly raw "$plist")" = "true"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AbstractAssistant.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Tag the commit and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="watch-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}"
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "Apple Watch ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }})" \
            --notes "Uploaded to App Store Connect after approval in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The build appears in TestFlight once Apple has processed it."

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

name: Apple app (iPhone + Watch)

on:
  push:
    branches: [main]
    paths: ["phone/iphone/**", "watch/apple/**", ".github/workflows/iphone.yml", ".github/workflows/watch.yml", ".github/actionlint.yaml"]
  pull_request:
    paths: ["phone/iphone/**", "watch/apple/**", ".github/workflows/iphone.yml", ".github/workflows/watch.yml", ".github/actionlint.yaml"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Request human approval to sign and upload the combined iPhone + Watch app"
        type: boolean
        default: false
      signed_candidate:
        description: "Request human approval to sign and export the App Store candidate (.ipa) without uploading"
        type: boolean
        default: false
      full_ui_suite:
        description: "Run the full native UI suite (always enabled for uploads)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: iphone-${{ github.event_name }}-${{ github.ref }}-${{ (inputs.upload || inputs.signed_candidate) && github.run_id || 'checks' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.upload || inputs.signed_candidate)) }}

env:
  XCODE_MAJOR: "27"
  PROJECT_DIR: phone/iphone
  TEAM_ID: K3R4D6HP2A

jobs:
  contracts:
    name: Release contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release provenance and failure cases
        run: python3 -m unittest discover -s phone/iphone/scripts/tests -v
      - name: Validate workflow
        run: |
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/iphone.yml .github/workflows/watch.yml
      - name: Shell syntax
        run: bash -n phone/iphone/scripts/select-xcode.sh phone/iphone/scripts/upload-candidate.sh

  watch_checks:
    name: Watch package and companion build
    needs: contracts
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select released Xcode
        run: bash phone/iphone/scripts/select-xcode.sh
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Shared gateway client package tests (AbstractGatewayClient, the watch's and the iPhone's)
        run: swift test --package-path watch/apple/Packages/AbstractGatewayClient --scratch-path "$RUNNER_TEMP/ClientPackageTests" --jobs 1
      - name: Shared push package tests (sign-in store, registration, push rendering)
        run: swift test --package-path phone/iphone/Packages/AssistantPush --scratch-path "$RUNNER_TEMP/PushPackageTests" --jobs 1
      - name: Generate the AbstractAssistant project (iPhone app, watch companion, extensions)
        run: xcodegen generate --spec phone/iphone/project.yml
      - name: Build independent Watch companion
        run: |
          xcodebuild build -project phone/iphone/AbstractAssistant.xcodeproj -scheme AbstractAssistantWatch \
            -destination 'generic/platform=watchOS Simulator' -configuration Debug -jobs 1 \
            -derivedDataPath "$RUNNER_TEMP/WatchSimulator" CODE_SIGNING_ALLOWED=NO -quiet

  build:
    # Pushes and pull requests stop here: tests only, no Apple credentials, no archive. The phone app
    # carries explicit entitlements (2026-10-22), so a Release archive must be signed, and signing
    # needs the App Store Connect key that only the protected `app-store` environment holds: the
    # signed archive is built by the on-demand `signed` job below.
    name: Test combined iPhone + Watch app
    needs: [contracts, watch_checks]
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      native_suite: ${{ steps.native.outputs.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select released Xcode
        run: bash phone/iphone/scripts/select-xcode.sh
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Version and unique build number
        id: version
        run: |
          python3 phone/iphone/scripts/release.py metadata --project phone/iphone/project.yml \
            --run-number "$GITHUB_RUN_NUMBER" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Package tests (AssistantKit, the iPhone's logic on the shared gateway client)
        run: swift test --package-path phone/iphone/Packages/AssistantKit --scratch-path "$RUNNER_TEMP/SwiftTests" --jobs 1
      - name: Generate project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate --spec project.yml
      - name: Create isolated iPhone simulator
        run: |
          # The UI tests assume a compact iPhone (a bottom tab bar, navigation-bar menus). The runner's iOS
          # 27.1 runtime offers only "iPhone Duo", whose regular-width layout has no tab bar, and that
          # runtime's build number (24A94425) is unparseable by xcodebuild (invalidDigitCount), which then
          # builds every simulator architecture. So: the newest iOS 26+ runtime offering "iPhone 17 Pro"
          # (in practice the newest iOS 26.x); else the newest runtime's newest regular iPhone (never a
          # Duo/Fold-class device while another exists); the choice and the alternatives are printed.
          read -r runtime devtype < <(xcrun simctl list runtimes available -j | python3 -c '
          import json, re, sys
          rows = [r for r in json.load(sys.stdin)["runtimes"] if ".iOS-" in r["identifier"] and int(r["version"].split(".")[0]) >= 26]
          if not rows: raise SystemExit("No available iOS 26+ runtime")
          version = lambda r: tuple(map(int, r["version"].split(".")))
          phones = lambda r: [d for d in r.get("supportedDeviceTypes", []) if d.get("productFamily") == "iPhone"]
          for r in sorted(rows, key=version, reverse=True):
              print("available:", r["identifier"], [d["name"] for d in phones(r)][:6], file=sys.stderr)
          def gen(d):
              m = re.fullmatch(r"iPhone (\d+)( Pro)?", d["name"])
              return (1 if m else 0, int(m.group(1)) if m else 0, 1 if m and m.group(2) else 0)
          preferred = [r for r in rows if any(d["name"] == "iPhone 17 Pro" for d in phones(r))]
          if preferred:
              rt = max(preferred, key=version); pick = next(d for d in phones(rt) if d["name"] == "iPhone 17 Pro")
          else:
              usable = [r for r in rows if phones(r)]
              if not usable: raise SystemExit("No iOS 26+ runtime supports an iPhone device type")
              rt = max(usable, key=version); pick = max(phones(rt), key=gen)
          print("chosen:", rt["identifier"], pick["name"], file=sys.stderr)
          print(rt["identifier"], pick["identifier"])')
          echo "runtime=$runtime device=$devtype"
          simulator=$(xcrun simctl create "Assistant CI $GITHUB_RUN_ID" "$devtype" "$runtime")
          echo "IPHONE_CI_SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
      - name: Native tests
        id: native
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          FULL_UI: ${{ inputs.upload || inputs.full_ui_suite }}
        run: |
          selectors=(-only-testing:AbstractAssistantPhoneTests)
          suite=critical
          if [[ "$FULL_UI" == true ]]; then
            suite=full
            selectors+=(-only-testing:AbstractAssistantPhoneUITests)
          else
            for test in testWorkingOrbIsTheOnlyStopAndReturnsAfterCancellation \
              testRestoredImageSurvivesColdRelaunchPreviewAndTabChanges \
              testCategoryBulkControlsRespectHiddenAndDisabledTools \
              testGroupedHistoryArchivesAndRestoresUsingExistingActions; do
              selectors+=("-only-testing:AbstractAssistantPhoneUITests/PhoneUITests/$test")
            done
          fi
          xcodebuild test -project AbstractAssistant.xcodeproj -scheme AbstractAssistantPhoneUITests \
            -destination "platform=iOS Simulator,id=$IPHONE_CI_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/PhoneTests" -resultBundlePath "$RUNNER_TEMP/iPhoneTests.xcresult" \
            -jobs 1 -parallel-testing-enabled NO -collect-test-diagnostics never \
            "${selectors[@]}" -skip-testing:AbstractAssistantPhoneTests/LiveGatewayMediaTests \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -quiet
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iPhoneTests.xcresult
          retention-days: 14
          if-no-files-found: ignore
      - name: Remove owned simulator
        if: always()
        run: |
          if [[ -n "${IPHONE_CI_SIMULATOR:-}" ]]; then
            xcrun simctl delete "$IPHONE_CI_SIMULATOR"
          fi

  signed:
    # On demand only (Run workflow on main with `upload` or `signed_candidate`), after the required
    # human `app-store` approval. Signing uses two credential sets: the Apple Distribution
    # certificate (repository secrets APPLE_DISTRIBUTION_P12_*) and the App Store Connect API key
    # (`app-store` environment secrets ASC_*), with which Xcode creates or fetches the App Store
    # provisioning profiles itself (cloud signing; no profile is stored anywhere). It archives the
    # tested commit with the tested version and build number, then exports and optionally uploads.
    name: Sign, export and upload the combined candidate
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.upload || inputs.signed_candidate) && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    environment:
      name: app-store
      url: https://appstoreconnect.apple.com/apps
    concurrency:
      group: abstractassistant-app-store-upload
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build.outputs.version }}
      BUILD_NUMBER: ${{ needs.build.outputs.build }}
      NATIVE_SUITE: ${{ needs.build.outputs.native_suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select released Xcode
        run: bash phone/iphone/scripts/select-xcode.sh
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate --spec project.yml
      - name: Install signing material (temporary keychain and API key)
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set +x
          missing=()
          for name in P12_BASE64 P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Signing material missing: ${missing[*]} (APPLE_DISTRIBUTION_P12_* are repository secrets, ASC_* are app-store environment secrets)"
            exit 1
          fi
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo '::error::Invalid ASC_KEY_ID'; exit 1; }
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo '::error::Invalid ASC_ISSUER_ID'; exit 1; }
          umask 077
          signing="$RUNNER_TEMP/signing"
          mkdir -p "$signing"
          keychain="$signing/ci-signing.keychain-db"
          # Recorded first, so the always() cleanup finds whatever this step managed to create.
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security default-keychain -d user | sed -e 's/^ *"//' -e 's/" *$//' > "$signing/default-keychain"
          security list-keychains -d user | sed -e 's/^ *"//' -e 's/" *$//' > "$signing/search-list"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$signing/distribution.p12"
          security import "$signing/distribution.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$signing/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # This keychain first in the search list, and the default one: a key Xcode creates lands here too.
          search=()
          while IFS= read -r line; do [[ -n "$line" ]] && search+=("$line"); done < "$signing/search-list"
          security list-keychains -d user -s "$keychain" "${search[@]}"
          security default-keychain -d user -s "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "\"Apple Distribution: .*($TEAM_ID)\""; then
            echo "::error::APPLE_DISTRIBUTION_P12_BASE64 holds no valid Apple Distribution identity for team $TEAM_ID"
            exit 1
          fi
          key="$signing/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          openssl pkey -in "$key" -noout >/dev/null 2>&1 || { echo '::error::ASC_KEY_P8 is not a readable private key'; exit 1; }
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Archive signed Release candidate (cloud signing)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +x
          xcodebuild archive -project AbstractAssistant.xcodeproj -scheme AbstractAssistantPhone \
            -destination 'generic/platform=iOS' -configuration Release -jobs 1 \
            -derivedDataPath "$RUNNER_TEMP/PhoneArchive" -archivePath "$RUNNER_TEMP/AbstractAssistantPhone.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM_ID" OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" -quiet
      - name: Inspect the signed archive
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          archive="$RUNNER_TEMP/AbstractAssistantPhone.xcarchive"
          python3 scripts/release.py inspect --archive "$archive" --version "$VERSION" --build "$BUILD_NUMBER"
          # Every shipped bundle (iPhone app, its notification extension, Watch app, complication and
          # Watch notification extension) is signed by the team. Update the count when a target is added.
          signed=0
          while IFS= read -r -d '' bundle; do
            codesign --verify --strict "$bundle"
            team=$(codesign -dv "$bundle" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            [[ "$team" == "$TEAM_ID" ]] || { echo "::error::${bundle#"$archive"/} is signed by team '$team', not $TEAM_ID"; exit 1; }
            signed=$((signed + 1))
          done < <(find "$archive/Products/Applications" \( -name '*.app' -o -name '*.appex' \) -print0)
          (( signed == 5 )) || { echo "::error::Expected 5 signed bundles (2 apps, 3 extensions), found $signed"; exit 1; }
          echo "Signed bundles: $signed, team $TEAM_ID"
      - name: Package the signed candidate
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 scripts/release.py candidate --archive "$RUNNER_TEMP/AbstractAssistantPhone.xcarchive" \
            --output "$RUNNER_TEMP/iphone-candidate" --sha "$GITHUB_SHA" \
            --version "$VERSION" --build "$BUILD_NUMBER" --test-suite "$NATIVE_SUITE"
      - name: Export the App Store .ipa
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +x
          python3 scripts/release.py export-options "$RUNNER_TEMP/ExportOptions-export.plist" --team "$TEAM_ID" --destination export
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AbstractAssistantPhone.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" -exportPath "$RUNNER_TEMP/iphone-ipa" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ipas=("$RUNNER_TEMP"/iphone-ipa/*.ipa)
          [[ ${#ipas[@]} -eq 1 && -f "${ipas[0]}" ]] || { echo '::error::Export produced no single .ipa'; exit 1; }
          unpacked="$RUNNER_TEMP/ipa-check"
          ditto -x -k "${ipas[0]}" "$unpacked"
          authority=$(codesign -dv --verbose=2 "$unpacked"/Payload/*.app 2>&1 | awk '/^Authority=/ && !seen {print substr($0, 11); seen = 1}')
          [[ "$authority" == "Apple Distribution: "*"($TEAM_ID)" ]] || { echo "::error::The .ipa is signed by '$authority', not Apple Distribution ($TEAM_ID)"; exit 1; }
          echo "Exported $(basename "${ipas[0]}"), signed by $authority"
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iphone-candidate/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-ipa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iphone-ipa/*.ipa
          retention-days: 30
          if-no-files-found: error
      - name: Verify and upload the checked archive to App Store Connect
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bash phone/iphone/scripts/upload-candidate.sh "$RUNNER_TEMP/iphone-candidate"
      - name: Candidate summary
        env:
          UPLOADED: ${{ inputs.upload }}
        run: |
          {
            echo "## AbstractAssistant iPhone + Watch $VERSION ($BUILD_NUMBER), signed"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Native checks: $NATIVE_SUITE suite; live gateway tests excluded"
            echo '```json'
            cat "$RUNNER_TEMP/iphone-candidate/candidate.json"
            echo '```'
            if [[ "$UPLOADED" == true ]]; then
              echo 'Uploaded: Apple must process the build before it appears in TestFlight.'
              echo 'This does not submit App Review or release the app publicly.'
              echo 'After beta validation, select this exact build in App Store Connect and choose manual release.'
            else
              echo 'Not uploaded: the signed App Store .ipa is retained as an artifact for 30 days.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        run: |
          set +x
          signing="$RUNNER_TEMP/signing"
          if [[ -f "$signing/default-keychain" ]]; then
            security default-keychain -d user -s "$(cat "$signing/default-keychain")" || true
          fi
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          fi
          if [[ -f "$signing/search-list" ]]; then
            search=()
            while IFS= read -r line; do [[ -n "$line" ]] && search+=("$line"); done < "$signing/search-list"
            security list-keychains -d user -s "${search[@]}" || true
          fi
          rm -rf "$signing" "$RUNNER_TEMP/ipa-check"
